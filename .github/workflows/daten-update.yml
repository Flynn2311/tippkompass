name: Daten-Update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      quoten:
        description: "Quoten jetzt holen (kostet 4 Credits)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daten-update
  cancel-in-progress: false

env:
  FIREBASE_SA: ${{ secrets.FIREBASE_SA }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Daten holen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_ODDS: ${{ github.event_name == 'workflow_dispatch' && inputs.quoten }}
        run: node scripts/update.mjs
      - name: Weltrangliste prüfen
        # Läuft nur, wenn das Secret FIREBASE_SA eingerichtet ist. Ein Fehler hier stoppt das Daten-Update nicht.
        if: ${{ env.FIREBASE_SA != '' }}
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          npm install --no-save --no-audit --no-fund firebase-admin@12 >/dev/null
          node scripts/rangliste.mjs
      - name: Speichern
        run: |
          if git diff --quiet data.json; then echo "Nichts zu speichern"; exit 0; fi
          git config user.name "tippkompass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Daten-Update $(TZ=Europe/Zurich date '+%d.%m. %H:%M')"
          for versuch in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo "Gespeichert"; exit 0; fi
            echo "Versuch $versuch fehlgeschlagen (Konflikt oder Netzwerk)."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::data.json konnte nach 3 Versuchen nicht gespeichert werden. Der nächste Lauf in 30 Minuten holt die Daten neu."
          exit 1
